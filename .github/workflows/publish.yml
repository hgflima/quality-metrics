name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      # Perf gate is enforced on every push/PR via ci.yml; skip it here so
      # noisy shared-runner timings don't block a release. Applied at job
      # scope so it covers both the explicit Test step and the test run
      # triggered by `prepublishOnly` inside `npm publish`.
      QM_SKIP_PERF_GATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_NAME)"
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag v$TAG_NAME"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.tag || 'latest' }}"
