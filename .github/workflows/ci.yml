name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native bindings (npm/cli#4828 workaround)
        # The lockfile was generated on macOS arm64. `npm ci` has a
        # well-known bug where it sometimes skips platform-specific
        # optional native deps when the lockfile was generated on a
        # different OS. Force the Linux bindings in so the oxlint /
        # oxfmt CLIs can load their native binaries.
        run: |
          npm install --no-save --no-package-lock \
            @oxlint/binding-linux-x64-gnu \
            @oxfmt/binding-linux-x64-gnu

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Format check
        if: matrix.node == '20'
        run: npm run fmt:check

      - name: Lint (fast tier — wmc, halstead, lcom)
        if: matrix.node == '20'
        run: npm run lint:fast

      - name: Lint (deep tier — cbo, dit)
        if: matrix.node == '20'
        run: npm run lint:deep

      - name: Test
        if: matrix.node != '20'
        env:
          # Shared GitHub runners are ~4x slower than local dev boxes; the
          # default 1.2x tolerance over the architectural budget is too tight
          # for them. The fast tier still finishes well under 2x of target.
          QM_PERF_TOLERANCE: '2.0'
        run: npm test

      - name: Test (with coverage — gates lines >= 80%)
        if: matrix.node == '20'
        env:
          QM_PERF_TOLERANCE: '2.0'
        run: npm run test:coverage

      - name: Generate quality report
        if: matrix.node == '20'
        run: npm run report

      - name: Upload quality report
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            report/
            coverage/coverage-final.json
          retention-days: 14

      - name: E2E (real oxlint CLI × plugin integration)
        # Spawns the actual oxlint binary against fixtures to validate
        # that the published plugin loads and all 5 rules fire end-to-end.
        # See tests/integration/oxlint-cli/.
        run: npm run test:e2e

      - name: Benchmarks (informational — gate enforced via npm test)
        # The hard CI gate (fast < 1.2s, deep < 12s on a 500-file fixture per
        # docs/mvp/04-security-and-performance.md) lives in
        # tests/benchmarks/perf-gate.test.ts and runs as part of `npm test`.
        # This step surfaces the rich vitest bench timings (mean / p99 / hz)
        # for trend visibility without re-gating. Failures here do not fail
        # the workflow — only the perf-gate test does.
        if: matrix.node == '20'
        continue-on-error: true
        run: npm run bench
